<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie & Drama Stream</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #fff;
        }

        /* Header & Navbar */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
        }

        header h1 {
            color: #e50914;
            font-size: 24px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input, .search-box select {
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            outline: none;
            background: #333;
            color: #fff;
        }

        .search-box input {
            width: 200px;
        }

        .search-box button {
            padding: 8px 15px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn {
            display: none;
            padding: 6px 12px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #player-container iframe {
            width: 85%;
            height: 75%;
            border: none;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
        }

        /* Movies Grid */
        .container {
            padding: 30px 5%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .type-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(229, 9, 20, 0.85);
            padding: 3px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            font-size: 12px;
            color: #ffc107;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="getTrendingContent()">MY STREAM</h1>
        <div class="search-box">
            <!-- Content Type Filter -->
            <select id="type-select">
                <option value="multi">All (Movies & Dramas)</option>
                <option value="movie">Movies Only</option>
                <option value="tv">K-Dramas / Series</option>
            </select>

            <!-- Language Filter -->
            <select id="lang-select">
                <option value="all">All Languages</option>
                <option value="hi">Hindi Dubbed / Sub</option>
                <option value="ko">Korean (K-Drama)</option>
                <option value="en">English</option>
            </select>

            <input type="text" id="search-input" placeholder="Search Movie, K-Drama...">
            <button id="search-btn">Search</button>
        </div>
    </header>

    <!-- Modal Player -->
    <div id="player-container">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <iframe id="video-iframe" src="" allowfullscreen></iframe>
    </div>

    <div class="container">
        <button id="back-btn" class="back-btn" onclick="getTrendingContent()">← Back to Trending</button>
        <div class="section-header">
            <h2 class="section-title" id="heading">Trending Movies & K-Dramas</h2>
        </div>
        <div class="movies-grid" id="movies-grid"></div>
    </div>

    <script>
        const API_KEY = '203a80846675dc5aec6ff3961867f1a3'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_PATH = 'https://image.tmdb.org/t/p/w500';

        const moviesGrid = document.getElementById('movies-grid');
        const playerContainer = document.getElementById('player-container');
        const videoIframe = document.getElementById('video-iframe');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const backBtn = document.getElementById('back-btn');
        const typeSelect = document.getElementById('type-select');
        const langSelect = document.getElementById('lang-select');

        // Event Listeners
        searchBtn.addEventListener('click', searchContent);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') searchContent();
        });

        // Fetch Trending Movies + K-Dramas / TV Shows
        async function getTrendingContent() {
            backBtn.style.display = 'none';
            document.getElementById('heading').innerText = 'Trending Movies & K-Dramas';
            moviesGrid.innerHTML = '<p style="color:#fff;">Loading content...</p>';
            searchInput.value = '';

            try {
                const res = await fetch(`${BASE_URL}/trending/all/week?api_key=${API_KEY}`);
                const data = await res.json();
                displayResults(data.results);
            } catch (err) {
                console.error("Error fetching trending content:", err);
            }
        }

        // Search Movies, Series & K-Dramas with Language Filter
        async function searchContent() {
            const query = searchInput.value.trim();
            const searchType = typeSelect.value;
            const targetLang = langSelect.value;

            if(!query && targetLang === 'all') {
                getTrendingContent();
                return;
            }

            backBtn.style.display = 'inline-block';
            document.getElementById('heading').innerText = query ? `Results for: "${query}"` : `Filtered Content`;
            moviesGrid.innerHTML = '<p style="color:#fff;">Searching...</p>';

            try {
                let url = `${BASE_URL}/search/${searchType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                
                // Add language filter if selected
                if(targetLang !== 'all') {
                    url += `&with_original_language=${targetLang}`;
                }

                const res = await fetch(url);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    displayResults(data.results);
                } else {
                    moviesGrid.innerHTML = '<p style="color:#e50914; font-size: 18px;">No results found! Try changing filter or search name.</p>';
                }
            } catch (err) {
                console.error("Error searching content:", err);
                moviesGrid.innerHTML = '<p style="color:#fff;">Error loading results.</p>';
            }
        }

        // Display Items Grid
        function displayResults(items) {
            moviesGrid.innerHTML = '';
            items.forEach(item => {
                const title = item.title || item.name;
                const mediaType = item.media_type || (item.first_air_date ? 'tv' : 'movie');
                
                if(!item.poster_path) return;

                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.onclick = () => playMedia(item.id, mediaType);

                card.innerHTML = `
                    <span class="type-badge">${mediaType === 'tv' ? 'Series/Drama' : 'Movie'}</span>
                    <img src="${IMAGE_PATH + item.poster_path}" alt="${title}">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-rating">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });
        }

        // Play Video via Embed Server (VidSrc)
        function playMedia(id, type) {
            let embedUrl = '';
            
            // VidSrc automatically handles Movie or TV/Drama Episode 1
            if(type === 'tv') {
                embedUrl = `https://vidsrc.me/embed/tv?tmdb=${id}&season=1&episode=1`;
            } else {
                embedUrl = `https://vidsrc.me/embed/movie?tmdb=${id}`;
            }

            videoIframe.src = embedUrl;
            playerContainer.style.display = 'flex';
        }

        // Close Video Player
        function closePlayer() {
            videoIframe.src = '';
            playerContainer.style.display = 'none';
        }

        // Initialize Page
        getTrendingContent();
    </script>
</body>
</html>
