<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Movie Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #fff;
        }

        /* Header & Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #e50914;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            outline: none;
            width: 250px;
            background: #333;
            color: #fff;
        }

        .search-box button {
            padding: 8px 15px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #player-container iframe {
            width: 80%;
            height: 70%;
            border: none;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
        }

        /* Movies Grid */
        .container {
            padding: 30px 5%;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            font-size: 12px;
            color: #ffc107;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MY STREAM</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search any movie...">
            <button id="search-btn">Search</button>
        </div>
    </header>

    <!-- Modal Player -->
    <div id="player-container">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <iframe id="video-iframe" src="" allowfullscreen></iframe>
    </div>

    <div class="container">
        <h2 class="section-title" id="heading">Trending Movies</h2>
        <div class="movies-grid" id="movies-grid"></div>
    </div>

    <script>
        const API_KEY = '203a80846675dc5aec6ff3961867f1a3'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_PATH = 'https://image.tmdb.org/t/p/w500';

        const moviesGrid = document.getElementById('movies-grid');
        const playerContainer = document.getElementById('player-container');
        const videoIframe = document.getElementById('video-iframe');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');

        // Search Events (Click & Enter Key)
        searchBtn.addEventListener('click', searchMovies);
        searchInput.addEventListener('keyup', function (e) {
            if (e.key === 'Enter') {
                searchMovies();
            }
        });

        // Fetch Trending Movies
        async function getTrendingMovies() {
            try {
                const res = await fetch(`${BASE_URL}/trending/movie/week?api_key=${API_KEY}`);
                const data = await res.json();
                displayMovies(data.results);
            } catch (err) {
                console.error("Error fetching trending movies:", err);
            }
        }

        // Search Movies Function
        async function searchMovies() {
            const query = searchInput.value.trim();
            if(!query) return;

            document.getElementById('heading').innerText = `Search Results for: "${query}"`;
            moviesGrid.innerHTML = '<p style="color:#fff;">Searching...</p>';

            try {
                const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    displayMovies(data.results);
                } else {
                    moviesGrid.innerHTML = '<p style="color:#e50914; font-size: 18px;">No movies found!</p>';
                }
            } catch (err) {
                console.error("Error searching movies:", err);
                moviesGrid.innerHTML = '<p style="color:#fff;">Error loading results. Please try again.</p>';
            }
        }

        // Display Movies Grid
        function displayMovies(movies) {
            moviesGrid.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;

                const movieCard = document.createElement('div');
                movieCard.classList.add('movie-card');
                movieCard.onclick = () => playMovie(movie.id);

                movieCard.innerHTML = `
                    <img src="${IMAGE_PATH + movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-rating">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</div>
                    </div>
                `;
                moviesGrid.appendChild(movieCard);
            });
        }

        // Play Movie via Embed Server (VidSrc)
        function playMovie(id) {
            const embedUrl = `https://vidsrc.me/embed/movie?tmdb=${id}`;
            videoIframe.src = embedUrl;
            playerContainer.style.display = 'flex';
        }

        // Close Video Player
        function closePlayer() {
            videoIframe.src = '';
            playerContainer.style.display = 'none';
        }

        // Initialize Page
        getTrendingMovies();
    </script>
</body>
</html>
